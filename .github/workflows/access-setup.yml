name: Configure Cloudflare Access

# Run by hand (Actions → Configure Cloudflare Access → Run workflow) to create
# or update the Access application that puts sign-in in front of the portal.
# Safe to re-run. It prints the application's AUD tag, which must match
# ACCESS_AUD in wrangler.jsonc.
#
# Uses the CLOUDFLARE_ACCESS_API secret if set, otherwise CLOUDFLARE_API. The
# token needs "Access: Apps and Policies Edit" and "Access: Organizations,
# Identity Providers, and Groups Edit". A separate CLOUDFLARE_ACCESS_API token
# keeps those permissions out of the deploy workflow that runs on every push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    env:
      ACCESS_HOSTNAMES: sandstone-internal-portal.monsterracapital.workers.dev,internal.sandstonesecurity.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Cloudflare credentials
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API || secrets.CLOUDFLARE_API }}
          PINNED_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash .github/scripts/cloudflare-preflight.sh

      - name: Configure Access application
        run: bash .github/scripts/cloudflare-access-setup.sh
