name: Deploy to Cloudflare

# Deploys the Worker (and applies remote D1 migrations) on every push to main.
# Requires the repository secret CLOUDFLARE_API to hold a Cloudflare API token
# with Workers Scripts:Edit and D1:Edit permissions. An optional
# CLOUDFLARE_ACCOUNT_ID secret pins the account when the token can see several.
# An optional PORTAL_GITHUB_TOKEN secret becomes the Worker's GITHUB_TOKEN, which
# files bug reports and feature requests as issues on the GitHub Project.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Normalises the token and resolves the account ID up front, so wrangler
      # never has to call the user-level /memberships endpoint (which
      # account-owned tokens can't access), and so a bad token fails here with
      # Cloudflare's actual error message instead of an opaque 9106.
      - name: Check Cloudflare credentials
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API }}
          PINNED_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash .github/scripts/cloudflare-preflight.sh

      - name: Apply D1 migrations (remote)
        run: npx wrangler d1 migrations apply sandstone-internal-portal --remote

      - name: Build and deploy Worker
        run: npm run deploy

      # Copies the GitHub token for bug reports into the Worker's secrets. Skipped
      # when the repository secret isn't set; the portal then says GitHub isn't
      # connected instead of filing.
      - name: Set GitHub token for bug reports
        env:
          PORTAL_GITHUB_TOKEN: ${{ secrets.PORTAL_GITHUB_TOKEN }}
        run: |
          if [ -z "$PORTAL_GITHUB_TOKEN" ]; then
            echo "PORTAL_GITHUB_TOKEN isn't set; bug reports stay off."
            exit 0
          fi
          printf '%s' "$PORTAL_GITHUB_TOKEN" | npx wrangler secret put GITHUB_TOKEN
